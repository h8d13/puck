[workspace]
resolver = "3"
members = [
	"alpm-core",
	"pacman-common",
	"pacman-cli",
	"testpkg",
	"vercmp",
	"difftest",
	"alpm-capi",
]
# submodules: C reference and ALPM (its own workspace)
exclude = ["pacman", "alpm"]

[workspace.package]
version = "0.1.0"
# ships through the PKGBUILD, not crates.io
publish = false
edition = "2024"
# derived from pacman sources, same license
license = "GPL-2.0-or-later"

# crates ALPM (alpm/ submodule, the reference) itself depends on, same
# versions; see METHODOLOGY.md
[workspace.dependencies]
base64 = "0.23.0"
bzip2 = "0.6.0"
# zlib-rs: zlib's inflate (libarchive links zlib), not miniz_oxide
flate2 = { version = "1", features = ["zlib-rs"] }
# static: xz built in from liblzma-sys's bundled source, not the system
# liblzma
liblzma = { version = "0.4.1", features = ["static"] }
md-5 = "0.11.0"
# glibc's SIMD memchr for the readers' line and nul scans
memchr = "2.8"
sha2 = "0.11.0"
tar = "0.4.44"
time = "0.3.47"
unicode-width = "0.2"
zstd = "0.14.0"
# system-level, see METHODOLOGY.md
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# dload: the connection a failed request went out on (reqwest shows it
# on responses only), for curl's retry of a dead reused connection
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy"] }
http = "1"
# use-libc: ids and file calls through libc like the C's, so LD_PRELOAD
# shims (fakeroot) see them as they see std's
rustix = { version = "1.1", features = ["event", "fs", "net", "process", "system", "termios", "use-libc"] }
landlock = "0.4"
libseccomp = "0.4"
signal-hook = "0.4"
# lz4 blocks under libarchive's lz4 frame reader, see METHODOLOGY.md
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash32"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# the C returns error codes, so does the port: no aborts, no stubs
[workspace.lints.clippy]
dbg_macro = "deny"
enum_variant_names = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
