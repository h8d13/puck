[package]
name = "difftest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# no workspace lints: this crate is the one place allowed to call C

[dependencies]
alpm-core = { path = "../alpm-core" }
pacman-common = { path = "../pacman-common" }
pacman-cli = { path = "../pacman-cli" }
testpkg = { path = "../testpkg" }
# fixture encoders, driven like alpm-compress does: xz parallel,
# zstd with a worker
bzip2.workspace = true
flate2.workspace = true
liblzma = { workspace = true, features = ["parallel"] }
zstd = { workspace = true, features = ["zstdmt"] }
# lz4 legacy frames (lz4 -l), which libarchive does not write
lz4_flex = { workspace = true, features = ["frame"] }
# pty pairs for the terminal tests (getcols, flush_term_input)
rustix = { workspace = true, features = ["pty"] }
time.workspace = true
