[package]
name = "difftest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# no workspace lints: this crate is the one place allowed to call C

[dependencies]
alpm-core = { path = "../alpm-core" }
pacman-common = { path = "../pacman-common" }
pacman-cli = { path = "../pacman-cli" }
testpkg = { path = "../testpkg" }
alpm-compress.workspace = true
alpm-types.workspace = true
# pty pairs for the terminal tests (getcols, flush_term_input)
rustix = { workspace = true, features = ["pty"] }
