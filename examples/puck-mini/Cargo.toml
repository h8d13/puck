[package]
name = "puck-mini"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# the whole point: default features only, never `internals`
[dependencies]
alpm-core = { path = "../../alpm-core" }

# fixtures only (a local db dir, a sync .db, a cached package): already
# workspace deps, the binary itself pulls neither
[dev-dependencies]
tar.workspace = true
flate2.workspace = true

[lints]
workspace = true
